[pytest]
asyncio_mode = auto
markers =
    integration: marks tests as requiring a real LLM and network access (deselect with -m "not integration")
    live_copilot: marks tests as requiring live GitHub Copilot authentication (deselect with -m "not live_copilot")
    live_ollama: marks tests as requiring a real local Ollama server (deselect with -m "not live_ollama")
