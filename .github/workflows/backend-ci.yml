name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

# Least-privilege default: this workflow only reads the repository and
# writes test-result artifacts. Do not broaden without a documented reason.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Deterministic regression + security + guards
    runs-on: ubuntu-latest
    # Deterministic-only: no live LLM endpoint here, no real secrets. This
    # job must never require INTERNAL_API_KEY / OPENROUTER_API_KEY etc. to be
    # anything other than the fixed test values conftest.py already sets.
    env:
      OLLAMA_BASE_URL: "http://127.0.0.1:9" # deliberate blackhole -- forces the deterministic floor
      CANONICAL_SEMANTIC_LLM_PRIMARY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true # tighten to a hard failure once the existing codebase is triaged clean

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports
        continue-on-error: true # tighten to a hard failure once the existing codebase is triaged clean

      - name: Raw-text semantic-authority guard
        run: pytest -q tests/test_raw_text_semantic_authority_guard.py

      - name: Security and adversarial tests
        run: >
          pytest -q
          tests/test_adversarial_findings.py tests/test_adversarial_llm_outputs.py
          tests/test_adversarial_mutation.py tests/test_agent_security.py
          tests/test_auth_fail_closed.py tests/test_prompt_injection_regression.py
          tests/test_release_failure_injection.py tests/test_remediation_canonicalization_adversarial.py
          tests/test_security.py tests/test_rate_limiting.py tests/test_no_rag.py

      - name: Capability-gate and provenance tests
        run: >
          pytest -q
          tests/test_autonomy_framework.py tests/test_autonomy_provenance_integration.py
          tests/test_ai_provenance_roundtrip.py tests/test_analysis_provenance_unified.py
          tests/test_certification_gate_reporting.py

      - name: Full deterministic regression
        run: >
          pytest -q --timeout=120
          --ignore=tests/test_real_llm_semantic_quality.py
          --ignore=tests/test_live_graph_resilience.py
          --ignore=tests/test_live_graph_causal_invariants.py
          --ignore=tests/test_live_ollama_evaluation_harness_phase23.py
          --ignore=tests/test_live_ollama_matrix_phase22.py
          --ignore=tests/test_live_ollama_matrix_phase24.py
          --ignore=tests/test_live_ollama_matrix_phase25.py
          --ignore=tests/test_financial_semantic_real_ollama.py
          --ignore=tests/test_live_panels_remediation_pricing.py
          --ignore=tests/test_financial_semantic_generalization_matrix2.py
          --ignore=tests/test_analyze_finding.py
          --junitxml=regression-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-regression-results
          path: backend/regression-results.xml
          retention-days: 14

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
        continue-on-error: true # advisory only until a triage/allowlist policy is agreed

  build:
    name: Build sanity (import + app startup)
    runs-on: ubuntu-latest
    needs: test
    env:
      OLLAMA_BASE_URL: "http://127.0.0.1:9"
      INTERNAL_API_KEY: "ci-smoke-test-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Import the FastAPI app (packaging/import sanity)
        run: python -c "from app.main import app; print('OK:', app.title if hasattr(app, 'title') else 'app importable')"
